<!DOCTYPE html>

  <link rel="stylesheet" href="includes/style.css">
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0d0d0d url('includes/dog.jpeg') no-repeat center center fixed; /* تم تغيير خلفية الموقع إلى dog */
      background-size: cover;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    /* Container Wrap */
    .wrapper {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header & Logo */
    .logo-container {
      margin-bottom: 10px;
    }

    .logo-container img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff9900;
      box-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
    }

    h1 {
      display: none;
    }

    /* Support Banner */
    h2 {
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px solid #ff8800;
      border-radius: 20px;
      padding: 8px 25px;
      font-size: 1.1rem;
      color: #ffffff;
      text-align: center;
      box-shadow: 0 0 10px rgba(255, 136, 0, 0.3);
      margin-bottom: 15px;
      font-weight: 500;
    }

    #UA {
      font-size: 0.8rem;
      color: #aaaaaa;
      margin-bottom: 10px;
      display: none;
    }

    /* Control Panel Section */
    .btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      width: 100%;
    }

    #kernel-options {
      display: flex;
      gap: 15px;
      color: #ff9900;
      font-weight: bold;
    }

    /* Main Action Button */
    #jeilbrek {
      background: linear-gradient(180deg, #ff9900 0%, #d46b08 100%);
      color: #ffffff;
      border: none;
      padding: 6px 45px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 153, 0, 0.5);
      transition: all 0.2s ease;
    }

    #jeilbrek:hover {
      transform: scale(1.03);
      box-shadow: 0 0 18px rgba(255, 153, 0, 0.8);
    }

    /* Auto Jailbreak Toggle */
    .autoJb {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .autoJb input[type="checkbox"] {
      accent-color: #00e676;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* Console & Layout Screen */
    .main-layout {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .media-box {
      display: none;
    }

    p1 {
      display: none;
    }

    #console {
      width: 100%;
      height: 280px;
      background-color: #000000;
      border: 2px solid #1a1a1a;
      border-radius: 18px;
      padding: 15px;
      color: #ff9900;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      overflow-y: auto;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 0, 0, 0.5);
      text-align: left;
      direction: ltr;
    }

    /* Footer Credits Bar */
    .credits-bar {
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 0.95rem;
      color: #ffffff;
      flex-wrap: wrap;
    }

    .credits-bar span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .credits-bar a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }

    .credits-bar a:hover {
      color: #ff9900;
      text-decoration: underline;
    }

    .separator {
      color: #ff9900;
      font-size: 0.8rem;
    }

    hr {
      display: none;
    }
  </style>
</head>
